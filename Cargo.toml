[workspace]
resolver = "2"
members = [
    "crates/companion-core",
    "crates/companion-platform",
    "crates/companion-engine",
    "ui/src-tauri",
]
# The Tauri UI needs the built frontend (ui/dist) to compile, so plain
# `cargo build` / `cargo test` skip it. Build it with `npm run tauri build` in ui/.
default-members = [
    "crates/companion-core",
    "crates/companion-platform",
    "crates/companion-engine",
]

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "MIT"
readme = "README.md"
description = "Create Companion: turns Naya Create Tune/Touch gestures into per-application shortcuts"
repository = "https://github.com/create-collective/create-companion"

[workspace.dependencies]
companion-core = { path = "crates/companion-core" }
companion-platform = { path = "crates/companion-platform" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
crossbeam-channel = "0.5"
ctrlc = "3"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
