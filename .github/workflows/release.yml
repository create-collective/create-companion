# Release: on a version tag, build the Windows installer and the macOS dmg and
# attach them to a GitHub Release.
#
# Signing: Windows through Azure Artifact Signing, macOS with a Developer ID
# certificate plus notarization. Both switch on by themselves once the secrets
# and variables named in the build steps exist (the two build scripts in tools/
# say what each one is); until then the builds are unsigned.

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Version matches the tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver=$(python -c "import json;print(json.load(open('ui/src-tauri/tauri.conf.json'))['version'])")
          test "$tag" = "$ver" || (echo "::error::tag v$tag != tauri.conf.json version $ver" && exit 1)
      - name: Build installer (signed when the signing secrets exist)
        shell: pwsh
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
        run: powershell -ExecutionPolicy Bypass -File tools/build_installer.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: create-companion-windows
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/nsis/*.sha256
      - name: Release notes for this version (from CHANGELOG.md)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: python tools/release_notes.py "${GITHUB_REF_NAME#v}" "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" > RELEASE_BODY.md
      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Create Companion ${{ github.ref_name }}
          body_path: RELEASE_BODY.md
          files: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/nsis/*.sha256

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Build app bundle and dmg (universal; signed and notarized when the signing secrets exist)
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: bash tools/build_installer.sh
      - uses: actions/upload-artifact@v4
        with:
          name: create-companion-macos
          path: |
            target/universal-apple-darwin/release/bundle/dmg/*.dmg
            target/universal-apple-darwin/release/bundle/dmg/*.sha256
      - name: Release notes for this version (from CHANGELOG.md)
        if: startsWith(github.ref, 'refs/tags/v')
        run: python3 tools/release_notes.py "${GITHUB_REF_NAME#v}" "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" > RELEASE_BODY.md
      - name: GitHub Release (add the macOS assets)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Create Companion ${{ github.ref_name }}
          body_path: RELEASE_BODY.md
          files: |
            target/universal-apple-darwin/release/bundle/dmg/*.dmg
            target/universal-apple-darwin/release/bundle/dmg/*.sha256
