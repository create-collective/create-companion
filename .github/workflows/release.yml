# Release: on a version tag, build the Windows installer and the macOS dmg and
# attach them to a GitHub Release.
#
# Signing: Windows through Azure Artifact Signing, macOS with a Developer ID
# certificate plus notarization. Both switch on by themselves once the secrets
# and variables named in the build steps exist (the two build scripts in tools/
# say what each one is); until then the builds are unsigned.
#
# In-app updates: with TAURI_SIGNING_PRIVATE_KEY (and its password) the builds
# also sign what the updater downloads, and the last job writes latest.json,
# the manifest every installed copy reads, onto the release.

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Version matches the tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver=$(python -c "import json;print(json.load(open('ui/src-tauri/tauri.conf.json'))['version'])")
          test "$tag" = "$ver" || (echo "::error::tag v$tag != tauri.conf.json version $ver" && exit 1)
      - name: Build installer (signed when the signing secrets exist)
        shell: pwsh
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: powershell -ExecutionPolicy Bypass -File tools/build_installer.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: create-companion-windows
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/nsis/*.sha256
            target/release/bundle/nsis/*.sig
      - name: Release notes for this version (from CHANGELOG.md)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: python tools/release_notes.py "${GITHUB_REF_NAME#v}" "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" > RELEASE_BODY.md
      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Create Companion ${{ github.ref_name }}
          body_path: RELEASE_BODY.md
          files: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/nsis/*.sha256

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Build app bundle and dmg (universal; signed and notarized when the signing secrets exist)
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: bash tools/build_installer.sh
      - name: Name the update archive after the version
        run: |
          dir=target/universal-apple-darwin/release/bundle/macos
          if [ -f "$dir/Create Companion.app.tar.gz" ]; then
            v=$(python3 -c "import json; print(json.load(open('ui/src-tauri/tauri.conf.json'))['version'])")
            for ext in "" .sig; do
              mv "$dir/Create Companion.app.tar.gz$ext" "$dir/Create Companion_${v}_universal.app.tar.gz$ext"
            done
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: create-companion-macos
          path: |
            target/universal-apple-darwin/release/bundle/dmg/*.dmg
            target/universal-apple-darwin/release/bundle/dmg/*.sha256
            target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz
            target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz.sig
      - name: Release notes for this version (from CHANGELOG.md)
        if: startsWith(github.ref, 'refs/tags/v')
        run: python3 tools/release_notes.py "${GITHUB_REF_NAME#v}" "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" > RELEASE_BODY.md
      - name: GitHub Release (add the macOS assets)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Create Companion ${{ github.ref_name }}
          body_path: RELEASE_BODY.md
          files: |
            target/universal-apple-darwin/release/bundle/dmg/*.dmg
            target/universal-apple-darwin/release/bundle/dmg/*.sha256
            target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz

  # latest.json, what every installed copy's updater reads, once both platforms' files are on
  # the release. It names each file's signature, and the tool refuses one that does not verify
  # against the public key built into the app.
  updater-manifest:
    needs: [windows, macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true
      - name: Release notes for this version (from CHANGELOG.md)
        run: python3 tools/release_notes.py "${GITHUB_REF_NAME#v}" "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" > RELEASE_BODY.md
      - run: pip install cryptography
      - name: latest.json (every signature verified against the app's key)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/updater_manifest.py --tag "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --files files --notes RELEASE_BODY.md --out latest.json
      - name: Attach latest.json to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" latest.json --clobber --repo "$GITHUB_REPOSITORY"
